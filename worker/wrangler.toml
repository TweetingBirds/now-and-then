name = "now-and-then-sync"
main = "worker.js"
compatibility_date = "2026-10-01"

# KV namespace "now-and-then" in Nate's Cloudflare account.
[[kv_namespaces]]
binding = "NOW_AND_THEN"
id = "a8d1b6c4b4d243c2a05227906287293a"

# Daily backup: copy every board to a snapshot that KV keeps for 30 days.
# 09:00 UTC is the middle of the night in the US.
[triggers]
crons = ["0 9 * * *"]

# Plain settings (not secrets), deployed with the code.
# ADMINS: owner names (TOKEN_<NAME>, lowercased) who may create invites in the app.
# MAX_BOARDS: the most invited boards this Worker will hold, to stay well inside
# Workers KV's free tier. Raise it if you need more (see "Costs and limits" in the README).
[vars]
ADMINS = "nate"
MAX_BOARDS = "50"
