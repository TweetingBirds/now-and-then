name: Deploy sync Worker to Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Test the Worker
        working-directory: worker
        run: node --test test/worker.test.mjs
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Access tokens (TOKEN_NATE, TOKEN_TIFFANY, ...) are Worker secrets set with
          # `wrangler secret put` or the Cloudflare dashboard. They are deliberately not
          # pushed from here: a deploy keeps the Worker's existing secrets, so a deploy
          # can never swap or reset someone's token.
