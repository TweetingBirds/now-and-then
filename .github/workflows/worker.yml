name: Deploy sync Worker to Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # One access token per person. Add more TOKEN_<NAME> lines (and repo secrets) for more people.
          secrets: |
            TOKEN_NATE
            TOKEN_TIFFANY
        env:
          TOKEN_NATE: ${{ secrets.TOKEN_NATE }}
          TOKEN_TIFFANY: ${{ secrets.TOKEN_TIFFANY }}
