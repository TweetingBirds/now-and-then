name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp version and build
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APP_VERSION="$(sed -n 's/.*const APP_VERSION = "\([^"]*\)".*/\1/p' app/app.js)"
          sed -i -e "s/__BUILD_NUMBER__/$BUILD_NUMBER/g" -e "s/__BUILD_SHA__/$BUILD_SHA/g" -e "s/__BUILD_DATE__/$BUILD_DATE/g" app/app.js app/sw.js app/index.html
          printf '{"version":"%s","build":"%s","sha":"%s","date":"%s"}\n' "$APP_VERSION" "$BUILD_NUMBER" "$BUILD_SHA" "$BUILD_DATE" > app/version.json
          grep -q "__BUILD_" app/app.js app/sw.js app/index.html && { echo "Stamping failed"; exit 1; } || true
          cat app/version.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
